name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test

      # No secrets. The build must succeed on an empty environment, which is
      # also the guarantee the product makes: the guest quiz works without
      # Supabase, Places, or analytics configured.
      - name: Build
        run: npm run build
